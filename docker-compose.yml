services:
  mongo:
    image: mongo:8.0.26
    restart: unless-stopped

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - ecommerce_network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile

    image: codealpha-ecommerce-api:m6

    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/codealpha_store
      CLIENT_ORIGIN: http://localhost:8080
      NODE_ENV: production

    expose:
      - "5000"

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - ecommerce_network

  web:
    build:
      context: ./client
      dockerfile: Dockerfile

    image: codealpha-ecommerce-web:m6

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - ecommerce_network

volumes:
  mongo_data:

networks:
  ecommerce_network:
    driver: bridge